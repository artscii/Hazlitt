# Optional analytics stack; PostgreSQL is isolated from the Atlas/QMD network.
services:
  atlas:
    environment:
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_DASHBOARD_URL: ${UMAMI_DASHBOARD_URL:-}
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?Run node scripts/umami-setup.mjs}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Run node scripts/umami-setup.mjs}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:?Run node scripts/umami-setup.mjs}
      DISABLE_TELEMETRY: "1"
      CLIENT_IP_HEADER: X-Atlas-Client-IP
      SKIP_LOCATION_HEADERS: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    networks: [umami-private]
    mem_limit: 1g
    cpus: 1
    logging:
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?Run node scripts/umami-setup.mjs}
    volumes: [umami-data:/var/lib/postgresql/data]
    networks: [umami-private]
    mem_limit: 512m
    cpus: 0.5
    logging:
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  umami-private:
volumes:
  umami-data:
