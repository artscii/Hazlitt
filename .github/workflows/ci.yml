name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: docker build -t atlas-ci .
      - run: docker build -f pilot/Dockerfile -t atlas-qmd-ci .
      - run: docker build -f monitor/Dockerfile -t atlas-monitor-ci .
