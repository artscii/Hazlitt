services:
  atlas:
    build: .
    image: hazlitt-creek-evidence-atlas:2.0.0
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run node scripts/password.mjs first}
    volumes:
      - atlas-data:/data
    restart: unless-stopped
volumes:
  atlas-data:
