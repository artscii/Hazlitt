services:
  atlas:
    build:
      context: .
      args:
        ATLAS_SOURCE_REVISION: ${ATLAS_SOURCE_REVISION:-}
    image: hazlitt-creek-evidence-atlas:4.13.30
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      CADDY_PROXY_MODE: ${CADDY_PROXY_MODE:-0}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run node scripts/password.mjs first}
    volumes:
      - atlas-data:/data
    logging:
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
volumes:
  atlas-data:
